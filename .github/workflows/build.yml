# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
---
name: Build
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - "*.js"
      - "*.json"
      - "*.yml"
      - "packages/**"
      - "!**.md"
      - "!examples/**/*.js"
      - "!examples/**/*.json"
      - "!packages/**/__mocks__/**"
      - "!packages/**/__tests__/**"

jobs:
  build:
    name: Build Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Prepare Environment
        uses: 0xTheProDev/setup-js@v1.4
        with:
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
          version-file: .nvmrc

      - name: Build Artifacts
        run: pnpm build
